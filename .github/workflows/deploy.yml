name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Required GitHub Secrets (Settings > Secrets and variables > Actions):
#   - CLOUDFLARE_API_TOKEN: Cloudflare API token with Workers and D1 permissions
#   - CLOUDFLARE_ACCOUNT_ID: Cloudflare account ID
# These must be configured before the migration and deploy steps will succeed.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run test

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          command: d1 migrations apply training-logger-db --remote
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          command: deploy
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
